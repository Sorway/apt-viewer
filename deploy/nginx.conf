# Exemple à adapter : DNS interne + certificat déjà émis.
# Installer apache2-utils pour htpasswd. Ne pas utiliser sans TLS.
server {
    listen 443 ssl;
    server_name apt-observer.example.internal;
    ssl_certificate /etc/ssl/apt-observer/fullchain.pem;
    ssl_certificate_key /etc/ssl/apt-observer/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Supervision APT";
    auth_basic_user_file /etc/nginx/apt-observer.htpasswd;
    # Facultatif : limiter également au réseau administration (adapter avant activation).
    # allow 192.168.10.0/24;
    # deny all;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
