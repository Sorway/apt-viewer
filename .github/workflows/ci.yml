name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-artifact:
        description: Conserver les fichiers pour leur publication
        type: boolean
        default: false
    outputs:
      release-artifact-id:
        description: Archive et scripts vérifiés sur Linux
        value: ${{ jobs.linux.outputs.artifact-id }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Vérification · Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les scripts de déploiement
        run: |
          find . -path './node_modules' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
          find . -path './node_modules' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Vérifier la syntaxe JavaScript
        run: |
          find src public scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n 1 node --check

      - name: Vérifier les états de mise à jour
        run: node scripts/ci/verify-updates.mjs

  linux:
    name: Installation Linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Préparer l’archive candidate et les releases simulées
        run: |
          bash scripts/package-release.sh "$RUNNER_TEMP/release"
          node scripts/ci/prepare-release.mjs "$RUNNER_TEMP/release" "$RUNNER_TEMP/release-fixture"

      - name: Préparer le journal et la configuration
        run: |
          sudo install -d -m 0750 /var/log/apt-viewer-ci
          sudo install -m 0600 /dev/null /var/log/apt-viewer-ci/apt-cacher.log
          printf 'HOST=127.0.0.1\nPORT=3100\nLOG_PATH=/var/log/apt-viewer-ci/apt-cacher.log\n' | sudo tee /etc/apt-viewer.env >/dev/null
          sudo cp /etc/apt-viewer.env /tmp/apt-viewer.env.expected

      - name: Installer puis mettre à jour
        run: |
          sudo env PATH="$RUNNER_TEMP/release-fixture/bin:$PATH" \
            APT_VIEWER_FIXTURE_DIR="$RUNNER_TEMP/release-fixture" APT_VIEWER_REF=v0.0.0 \
            bash "$RUNNER_TEMP/release-fixture/versions/v0.0.0/install.sh"
          bash scripts/ci/verify-linux-update.sh "$RUNNER_TEMP/release-fixture"

      - name: Conserver les fichiers validés
        if: inputs.release-artifact
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 1

      - name: Afficher les journaux en cas d’échec
        if: failure()
        run: sudo journalctl -u apt-viewer.service -n 100 --no-pager
