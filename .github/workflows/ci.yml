name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Vérification · Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les scripts de déploiement
        run: |
          bash -n install.sh
          bash -n update.sh
          shellcheck install.sh update.sh

      - name: Vérifier la syntaxe JavaScript
        run: |
          find src public -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check

  linux:
    name: Installation Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Préparer le journal et la configuration
        run: |
          sudo install -d -m 0750 /var/log/apt-viewer-ci
          sudo install -m 0600 /dev/null /var/log/apt-viewer-ci/apt-cacher.log
          printf 'HOST=127.0.0.1\nPORT=3100\nLOG_PATH=/var/log/apt-viewer-ci/apt-cacher.log\n' | sudo tee /etc/apt-viewer.env >/dev/null
          sudo cp /etc/apt-viewer.env /tmp/apt-viewer.env.expected

      - name: Installer puis mettre à jour
        run: |
          sudo bash install.sh
          curl --fail http://127.0.0.1:3100/healthz
          sudo env APT_VIEWER_REF="$GITHUB_SHA" bash /opt/apt-viewer/update.sh
          sudo cmp /etc/apt-viewer.env /tmp/apt-viewer.env.expected
          curl --fail http://127.0.0.1:3100/healthz
          systemctl is-active apt-viewer.service

      - name: Afficher les journaux en cas d’échec
        if: failure()
        run: sudo journalctl -u apt-viewer.service -n 100 --no-pager
