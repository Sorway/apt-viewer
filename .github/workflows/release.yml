name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: CI complète
    uses: ./.github/workflows/ci.yml
    with:
      release-artifact: true

  publish:
    name: Publier la release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    permissions:
      contents: write
    steps:
      - name: Récupérer le tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Vérifier la version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const version = tag.replace(/^v/, '');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (tag.length > 100 || !/^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag) ||
              version !== pkg.version || version !== lock.version || version !== lock.packages[''].version) {
            throw new Error('Le tag, package.json et package-lock.json doivent porter la même version stable.');
          }
          NODE

      - name: Récupérer les fichiers validés par la CI
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.validate.outputs.release-artifact-id }}
          path: ${{ runner.temp }}/release/

      - name: Vérifier les empreintes
        working-directory: ${{ runner.temp }}/release
        run: sha256sum --check --strict SHA256SUMS

      - name: Publier les scripts et les notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: ${{ runner.temp }}/release
        run: |
          commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$commit" = "$GITHUB_SHA"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true
            gh release upload "$RELEASE_TAG" ./*.tar.gz install.sh update.sh SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" ./*.tar.gz install.sh update.sh SHA256SUMS \
              --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
